# The release of a tag vX.Y.Z (the release bot's, or one pushed by hand): the tests,
# the package on PyPI (secret PYPI_TOKEN), the Forgejo release with the version's
# section of CHANGELOG.md as its notes, then the deployment to apps, as deploy.yml
# does it by hand (keep the two deploy steps alike). Moved from GitHub, whose
# release dispatched a deployment there.
name: release
'on':
  push:
    tags:
    - v*
  # Run by hand to retry a tag's release from main, with the tag in the field
  # (a tag made before this trigger existed has no workflow_dispatch of its own).
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z); empty for the tag chosen above
        type: string
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Check the tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        case "$TAG" in
          v[0-9]*) ;;
          *) echo "::error::$TAG is not a release tag: name one in the tag field"; exit 1 ;;
        esac
    - name: Check out
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
        fetch-depth: 0
        lfs: true
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Set the version from the tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$TAG is no version tag (vX.Y.Z)"; exit 1 ;; esac
        sed -i "s/^version = .*/version = \"${TAG#v}\"/" pyproject.toml
    - name: Test
      run: |
        python -m pip install --quiet -e '.[test]'
        pytest
    - name: Build the package
      run: |
        python -m pip install --quiet build twine
        python -m build
    - name: Publish the package
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload --skip-existing --non-interactive dist/*
    - name: Collect the release files
      run: mkdir -p .forgejo-release && cp dist/* .forgejo-release/
    - name: Write the release notes
      id: release_notes
      shell: bash
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow --tags
        else
          git fetch --quiet --tags
        fi
        previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
        notes=$(awk -v v="${TAG#v}" '/^## / { if (found) exit; h = $2; gsub(/^\[|\]$/, "", h); sub(/^v/, "", h)
          if (h == v) { found = 1; next } } found' CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)
        if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
          notes=$(git log --no-merges --format='- %s' ${previous:+"$previous.."}"$TAG")
        fi
        {
          echo 'notes<<END_OF_NOTES'
          printf '%s\n' "$notes"
          echo END_OF_NOTES
        } >> "$GITHUB_OUTPUT"
    - name: Publish the release
      uses: https://code.forgejo.org/actions/forgejo-release@v2
      with:
        direction: upload
        url: ${{ github.server_url }}
        repo: ${{ github.repository }}
        tag: ${{ inputs.tag || github.ref_name }}
        title: ${{ inputs.tag || github.ref_name }}
        release-dir: .forgejo-release
        prerelease: 'false'
        override: false
        release-notes: ${{ steps.release_notes.outputs.notes }}
  deploy:
    needs: release
    runs-on: ubuntu-latest
    name: Deploy Local Flight Map to apps
    steps:
    - name: Check the tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        case "$TAG" in
          v[0-9]*) ;;
          *) echo "::error::$TAG is not a release tag: name one in the tag field"; exit 1 ;;
        esac
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
        fetch-depth: 0
        lfs: true
    - name: Deploy to apps
      shell: bash
      env:
        APPS_URL: https://apps.ciepiela.org
        APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
        APPS_APP: ${{ github.event.repository.name }}
        APPS_HEALTHCHECK: /service/health
        APPS_DELAY: '5'
        HD_ADSBEXCHANGE_API_KEY: ${{ secrets.ADSBEXCHANGE_API_KEY }}
        HD_DATA_PROVIDER: ${{ secrets.DATA_PROVIDER }}
        HD_ADSBEXCHANGE_FEEDER_UUID: ${{ secrets.ADSBEXCHANGE_FEEDER_UUID }}
        HD_MAP_REFRESH_INTERVAL: ${{ secrets.MAP_REFRESH_INTERVAL }}
        HD_OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
        HD_OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        api() {
          curl -fsS --retry 3 -H "Authorization: Bearer $APPS_TOKEN" -H "Accept: application/json" "$@"
        }
        uuid=$(api "$APPS_URL/api/v1/applications" \
          | jq -r --arg name "$APPS_APP" '[.[] | select(.name == $name)][0].uuid // empty')
        if [ -z "$uuid" ]; then
          echo "::error::The panel at $APPS_URL has no application named $APPS_APP."
          exit 1
        fi
        # The configuration: HD_NAME becomes NAME; what is empty here keeps its value there.
        vars=$(jq -n '[env | to_entries[] | select(.key | startswith("HD_")) | select(.value != "")
          | {key: .key[3:], value, is_literal: true}]')
        if [ "$vars" != "[]" ]; then
          jq -n --argjson data "$vars" '{data: $data}' | api -X PATCH -H "Content-Type: application/json" \
            -d @- "$APPS_URL/api/v1/applications/$uuid/envs/bulk" > /dev/null
        fi
        # The commit checked out here, also when it is not the branch's newest.
        jq -n --arg sha "$(git rev-parse HEAD 2> /dev/null || echo "$GITHUB_SHA")" '{git_commit_sha: $sha}' \
          | api -X PATCH -H "Content-Type: application/json" -d @- "$APPS_URL/api/v1/applications/$uuid" > /dev/null
        deployment=$(api -X POST "$APPS_URL/api/v1/deploy?uuid=$uuid&force=true" \
          | jq -r '.deployments[0].deployment_uuid')
        echo "Deployment $deployment of $APPS_APP"
        status=queued
        for _ in $(seq 180); do
          status=$(api "$APPS_URL/api/v1/deployments/$deployment" | jq -r .status)
          case "$status" in
            finished) break ;;
            failed | cancelled-by-user)
              echo "::error::The deployment ended as $status; its log is in the panel."
              exit 1
              ;;
          esac
          sleep 10
        done
        if [ "$status" != finished ]; then
          echo "::error::The deployment did not finish within 30 minutes ($status)."
          exit 1
        fi
        if [ -n "${APPS_HEALTHCHECK:-}" ]; then
          address=$(api "$APPS_URL/api/v1/applications/$uuid" | jq -r '(.fqdn // "") | split(",")[0]')
          sleep "${APPS_DELAY:-0}"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$address$APPS_HEALTHCHECK"
        fi
